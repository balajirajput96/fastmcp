name: Hourly Maintenance

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read maintenance state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hourly-maintenance.yml",
              per_page: 1,
            });
            core.setOutput("cycle", String(data.total_count));
      - uses: pnpm/action-setup@v4
        if: ${{ fromJSON(steps.state.outputs.cycle) <= 2400 }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ fromJSON(steps.state.outputs.cycle) <= 2400 }}
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        if: ${{ fromJSON(steps.state.outputs.cycle) <= 2400 }}
        run: pnpm install --frozen-lockfile
      - name: Run bounded validation
        id: validation
        if: ${{ fromJSON(steps.state.outputs.cycle) <= 2400 }}
        continue-on-error: true
        run: |
          pnpm lint
          pnpm test
          pnpm build
      - name: Record maintenance summary
        if: ${{ always() }}
        env:
          CYCLE: ${{ steps.state.outputs.cycle }}
          RESULT: ${{ steps.validation.outcome || 'skipped' }}
        run: |
          OUTCOME="${RESULT}"
          if [ "$CYCLE" -gt 2400 ]; then OUTCOME="cycle-limit-reached"; fi
          echo "## Hourly maintenance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cycle count: $CYCLE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation outcome: ${OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- State source: GitHub Actions workflow-run history" >> "$GITHUB_STEP_SUMMARY"
          echo "- Safety: no pull-request merge, source modification, credential storage, or issue creation" >> "$GITHUB_STEP_SUMMARY"
          cat > maintenance-remediation-draft.md <<EOF
          # Maintenance Remediation Draft

          Cycle: ${CYCLE}
          Validation outcome: ${OUTCOME}

          ## Proposed next action

          $(if [ "$OUTCOME" = "success" ]; then echo "No source change is proposed. Continue scheduled validation."; else echo "Review the associated GitHub Actions job logs and prepare a separate pull request only after reproducing the failure."; fi)

          This draft contains no logs, credentials, source edits, pull-request merge action, or automatic remediation.
          EOF
      - name: Upload remediation draft
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-remediation-draft
          path: maintenance-remediation-draft.md
          if-no-files-found: error
